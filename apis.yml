aid: donuts
name: Donuts
description: 'Donuts (now operating as Identity Digital, following the 2022 merger
  of Donuts Inc. and Afilias) runs the world''s largest portfolio of new generic top-level
  domains (gTLDs) — more than 280 extensions such as .email, .guru, .social, .live,
  and .restaurant. As a wholesale domain registry it provides DNS infrastructure,
  domain-name security, premium-domain services, and rights-protection tooling to
  the accredited registrars and resellers who sell domains to end customers. Its
  programmatic surface is registry-oriented and partner-facing: an EPP (Extensible
  Provisioning Protocol) interface for domain provisioning, a HTTP Reports API that
  delivers weekly domain and billing report files (CSV.gz over HTTP basic auth), and
  a Registrar Portal. There is no public REST/OpenAPI developer surface.'
